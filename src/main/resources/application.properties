spring.application.name=calculator-api
server.port=${SERVER_PORT:8080}

# Print 100 instead of 1E+2 for BigDecimal results
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: only health and info are exposed over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}

info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:dev}
management.info.env.enabled=true
