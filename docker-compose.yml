name: calculator

services:
  calculator:
    # Jenkins sets IMAGE_TAG to the build number; locally it defaults to "latest".
    image: ${DOCKER_IMAGE:-saivenkat1507/calculator-api}:${IMAGE_TAG:-latest}
    build: .
    deploy:
      replicas: 2            # two API replicas behind the Nginx proxy
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: ${IMAGE_TAG:-latest}
      HEALTH_SHOW_DETAILS: "never"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    expose:
      - "8080"               # reachable only inside the network, via the proxy
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8085}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - calc-net
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
