worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS. Re-resolving every 5s means nginx picks up new
    # container IPs after a redeploy instead of proxying to stale ones, and
    # round-robins across all replicas of the "calculator" service.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $backend http://calculator:8080;
            proxy_pass $backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
            # Expose which replica served the request (useful for the demo)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
